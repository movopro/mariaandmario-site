<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maria &amp; Mario</title>
<meta name="description" content="With great power comes great responsibility.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpolygon fill='%23FFD23A' stroke='%23000' stroke-width='4' points='32,2 39,20 58,14 46,30 62,40 42,42 46,62 32,48 18,62 22,42 2,40 18,30 6,14 25,20'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#E3272B;
    --red-deep:#B5161B;
    --ink:#000;
    --paper:#FFFFFF;
    --sun:#FFD23A;
    --sky:#1F6BFF;
  }

  *{ box-sizing:border-box; }

  html, body{
    height:100%;
    margin:0;
    overflow:hidden;
  }

  body{
    position:relative;
    display:grid;
    place-items:center;
    padding:
      calc(env(safe-area-inset-top, 0px) + 4vh)
      calc(env(safe-area-inset-right, 0px) + 4vw)
      calc(env(safe-area-inset-bottom, 0px) + 4vh)
      calc(env(safe-area-inset-left, 0px) + 4vw);
    background:var(--red);
    font-family:"Bangers","Impact","Haettenschweiler","Arial Narrow Bold",sans-serif;
    color:var(--ink);
    cursor:default;
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  /* Sunburst rays, centered on the quote */
  .rays{
    position:fixed;
    inset:-60%;
    background:repeating-conic-gradient(
      from 0deg at 50% 50%,
      var(--red-deep) 0deg 6deg,
      var(--red) 6deg 12deg
    );
    z-index:0;
  }

  /* Ben-Day halftone shading, creeping in from two corners */
  .dots{
    position:fixed;
    inset:0;
    z-index:1;
    background-image:radial-gradient(circle, var(--ink) 1.5px, transparent 1.7px);
    background-size:10px 10px;
    opacity:.55;
    -webkit-mask-image:
      linear-gradient(135deg, #000 0%, transparent 42%),
      linear-gradient(315deg, #000 0%, transparent 42%);
    mask-image:
      linear-gradient(135deg, #000 0%, transparent 42%),
      linear-gradient(315deg, #000 0%, transparent 42%);
  }

  .panel{
    position:relative;
    z-index:2;
    width:min(94vw, 1180px);
    padding:clamp(40px, 9vw, 110px) clamp(28px, 8vw, 110px);
    transform:rotate(-2deg);
    animation:slam .55s cubic-bezier(.2, 1.45, .4, 1) both;
  }

  .burst{
    position:absolute;
    inset:-9% -6%;
    width:112%;
    height:118%;
    overflow:visible;
    z-index:-1;
  }
  .burst polygon{
    fill:var(--sun);
    stroke:var(--ink);
    stroke-width:5;
    stroke-linejoin:miter;
    vector-effect:non-scaling-stroke;
  }

  .quote{
    margin:0;
    text-align:center;
    text-transform:uppercase;
    font-weight:400;
    font-size:clamp(2.2rem, 8.6vw, 7rem);
    line-height:.92;
    letter-spacing:.015em;
    color:var(--paper);
    -webkit-text-stroke:2.5px var(--ink);
    paint-order:stroke fill;
    text-shadow:
      5px 5px 0 var(--ink),
      9px 9px 0 var(--sky);
  }
  .quote span{ display:block; }

  /* Comic caption box — delete this element if you only want the quote */
  .caption{
    position:fixed;
    z-index:3;
    right:calc(env(safe-area-inset-right, 0px) + clamp(14px, 3vw, 36px));
    bottom:calc(env(safe-area-inset-bottom, 0px) + clamp(14px, 3vw, 36px));
    padding:.25em .7em .2em;
    background:var(--sun);
    border:3px solid var(--ink);
    box-shadow:5px 5px 0 var(--ink);
    font-size:clamp(1.15rem, 2.4vw, 1.7rem);
    letter-spacing:.06em;
    transform:rotate(1.5deg);
  }

  @keyframes slam{
    from{ transform:rotate(-12deg) scale(2.6); opacity:0; }
    to  { transform:rotate(-2deg)  scale(1);   opacity:1; }
  }

  @media (prefers-reduced-motion: reduce){
    .panel{ animation:none; }
  }

  @media (max-width: 600px){
    .burst{ inset:-14% -11%; width:122%; height:128%; }
    .panel{ padding:clamp(34px, 12vw, 60px) clamp(18px, 6vw, 40px); }
    .quote{ font-size:clamp(1.9rem, 10vw, 3rem); -webkit-text-stroke-width:2px; text-shadow:4px 4px 0 var(--ink), 7px 7px 0 var(--sky); }
  }
</style>
</head>
<body>
  <div class="rays" aria-hidden="true"></div>
  <div class="dots" aria-hidden="true"></div>

  <main class="panel">
    <svg class="burst" viewBox="-80 -60 1160 720" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <polygon points="1037,300 969,323 1049,359 932,372 973,417 902,413 965,482 860,455 919,538 815,492 863,539 752,519 731,572 665,551 643,619 586,555 552,599 500,556 447,621 416,560 350,603 328,549 264,596 255,530 152,551 174,488 96,530 139,458 68,477 75,418 -52,414 45,372 -53,360 24,325 -52,300 53,275 -60,235 41,229 -6,178 100,183 57,140 142,138 118,90 189,100 191,42 254,70 239,-12 335,57 352,-36 411,49 452,-9 500,38 552,-11 582,44 648,-18 674,52 748,1 748,85 858,26 823,101 902,84 859,140 934,142 907,186 1002,192 929,230 1005,241 946,275"/>
    </svg>
    <h1 class="quote">
      <span>With great power</span>
      <span>comes great</span>
      <span>responsibility.</span>
    </h1>
  </main>

  <p class="caption">Maria &amp; Mario</p>
</body>
</html>
